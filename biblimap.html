<!DOCTYPE html>
<html lang="de">

<head>
    <title>biblimap</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/pico.violet.min.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/biblimap.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="biblimap: teile deinen Sitzplatz mit Freund*innen. Für die Bibliotheken der HTWK und Universität Leipzig">
    <meta name="robots" content="index, follow">
    <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": [{
            "@type": "ListItem",
            "position": 1,
            "name": "HTWK-Bibliothek",
            "item": "https://biblimap.foxicle.de/?location=HTWK"
          },{
            "@type": "ListItem",
            "position": 2,
            "name": "Recht I-Bibliothek",
            "item": "https://biblimap.foxicle.de/?location=Recht+I"
          },{
            "@type": "ListItem",
            "position": 3,
            "name": "Recht II-Bibliothek",
            "item": "https://biblimap.foxicle.de/?location=Recht+II"
          }]
        }
    </script>
</head>

<body class="container">
    <header>
        <nav aria-labelledby="primary-navigation" id="nav_top">
            <ul>
                <li><h1><a id="header_title" href="index.html">biblimap</a></h1></li>
                <li><h3 id="header_subtitle">teile deinen Sitzplatz</h3></li>
            </ul>
            <ul>
                <li><button id="btn_help" class="icons outline secondary" aria-label="Hilfe"><img src="icons/help.svg" alt="help"></button></li>
                <li><button class="outline secondary" aria-label="Button, um vom hellen in den dunklen Modus zu wechseln."><img id="img_dm" src="icons/darkmode.svg" alt="toggle darkmode"></button></li>
                <li>
                    <details class="dropdown secondary">
                        <summary>Mehr</summary>
                        <ul dir="rtl">
                            <li><a href="faq.html" aria-label="Link zum FAQ dieses Projekts.">FAQ</a></li>
                            <li><a href="https://foxicle.de/datenschutzerklaerung.html" aria-label="Link zur Datenschutzseite.">Datenschutz</a></li>
                            <li><a href="https://github.com/MineErich/biblimap" target="_blank" aria-label="Link zu dem GitHub Repository dieses Projekts.">GitHub</a></li>
                        </ul>
                    </details>
                </li>
            </ul>
        </nav>
    </header>

    <div id="svg-container" aria-label="Hier ist der Grundriss einer Etage der ausgwählten Bibliothek zu sehen. Durch klicken auf die blauen Rechtecke im Bild, kann mensch einen Sitzplatz markieren."></div>

    <div class="bottom-nav container">
        <nav aria-labelledby="footer-navigation">
            <ul></ul>
            <ul>
                <li id="location_text"></li>
                <li><button class="nav_btn icons" id="btn_share" aria-label="Sitzplatz teilen."><img src="icons/cp.svg" alt="copy text"></button></li>
                <li><button class="nav_btn icons" id="btn_up" aria-label="Button, um eine Etage höher zu gehen."><img src="icons/up.svg" alt="floor up"></button></li>
                <li><button class="nav_btn icons" id="btn_down" aria-label="Button, um eine Etage nach unten zu gehen"><img src="icons/down.svg" alt="floor down"></button></li>
                <li><button class="nav_btn icons" id="btn_sel_bib" aria-label="Button, um eine andere Bibliothek zu wählen."><img src="icons/bib.svg" alt="choose library"></button></li>
            </ul>
            <ul></ul>
        </nav>
    </div>

    <dialog id="dialog_bib" aria-label="Diese Dialogbox wird geöffnet, wenn der Button zum Auswählen einer Bibliothek gedrückt wird.">
        <form>
            <p>
                <label>
                    Bibliothek wählen:
                    <select aria-label="Auswahlmenü zum Wählen einer Bibliothek">
                        <option value="HTWK">HTWK</option>
                        <option value="Recht I">Recht I</option>
                        <option value="Recht II">Recht II</option>
                    </select>
                </label>
            </p>
            <div>
                <button id="dialog_conf" value="default" aria-label="Bestätigen der Auswahl einer Bibliothek.">Confirm</button>
                <button id="dialog_close" value="cancel" formmethod="dialog" aria-label="Abbrechen der Auswahl einer Bibliothek.">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog id="dia_err">
        <p id="dia_err_txt">Hier sollte eine Fehlermeldung angezeigt werden, aber anscheinend trat ein Fehler beim verarbeiten des Fehlers auf.</p>
        <button id="dia_err_ok" value="default">OK</button>
    </dialog>

    <script type="module" src="src/biblimap.js"></script>

</body>
</html>
